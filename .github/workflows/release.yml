name: Build & Publish Semestero ME Releases

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Electron App
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Package Windows x64 Electron binary
        run: npm run pack

      - name: Zip Windows x64 Electron distribution
        run: python scripts/zip_windows.py

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-zip
          path: Semestero-ME-Windows-x64.zip
          if-no-files-found: error

  build-android:
    name: Build Android Phone, Tablet & Galaxy Watch APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sync Capacitor web bundle
        run: npm run build:mobile

      - name: Restore optional release keystore
        env:
          KEYSTORE_B64: ${{ secrets.SEMESTERO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/semestero-release-key.jks
            echo "Restored release keystore."
          else
            echo "SEMESTERO_KEYSTORE_BASE64 not set; Gradle will use debug signing fallback."
          fi

      - name: Build Phone APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Semestero-ME.apk

      - name: Build Tablet Clean APK
        run: |
          cd android
          ./gradlew :app:assembleRelease -PtabletEdition --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Semestero-ME-Tablet-Clean.apk

      - name: Build Galaxy Watch 8 APK
        run: |
          cd android
          ./gradlew :wear:assembleRelease --no-daemon
          cp wear/build/outputs/apk/release/wear-release.apk ../Semestero-ME-Watch.apk

      - name: Upload Android & Watch APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            Semestero-ME.apk
            Semestero-ME-Tablet-Clean.apk
            Semestero-ME-Watch.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release & Notify
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-zip
          path: .

      - name: Download Android & Watch APKs
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: .

      - name: Create/Update GitHub Release with all 4 binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/create_github_release.py

      - name: Send NTFY release notification
        run: |
          VER=$(python -c "import json; print(json.load(open('package.json', encoding='utf-8'))['version'])")
          python scripts/send_ntfy.py \
            --topic "adir-semestero-me-updates" \
            --title "Semestero ME v${VER} Binaries Published" \
            --message "GitHub Actions built and attached Windows x64 Electron ZIP + Android Phone, Tablet & Galaxy Watch 8 APKs to Release v${VER}." \
            --tags "package,rocket"
