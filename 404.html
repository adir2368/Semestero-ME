<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - דף לא נמצא | Semestero ME</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2.2.7">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png?v=2.2.7">
    <link rel="shortcut icon" href="favicon.ico?v=2.2.7">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rubik:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0f1d;
            --accent-cyan: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glow: rgba(56, 189, 248, 0.3);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Rubik', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(ellipse at 50% 20%, rgba(56, 189, 248, 0.15) 0%, transparent 60%),
                linear-gradient(rgba(15, 23, 42, 0.5) 1px, transparent 1px),
                linear-gradient(90deg, rgba(15, 23, 42, 0.5) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            text-align: center;
        }
        .error-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(56, 189, 248, 0.2);
            backdrop-filter: blur(12px);
        }
        .error-code {
            font-family: 'Orbitron', monospace;
            font-size: 5rem;
            font-weight: 900;
            color: var(--accent-cyan);
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
            line-height: 1;
            margin-bottom: 12px;
        }
        .error-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .error-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #fff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            border: 1px solid rgba(56, 189, 248, 0.4);
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            transition: all 0.2s ease;
        }
        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.6);
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
        }
        .countdown {
            margin-top: 18px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">404</div>
        <h1 class="error-title">הנתיב המבוקש לא קיים במערכת</h1>
        <p class="error-desc">נראה שהגעת לנתיב לא מוכר. כל הקורסים, המשימות והמחשבונים של סמסטרו מחכים לך במסך הראשי.</p>
        <a href="./index.html" class="btn-home">
            <span>🚀 חזרה ל-Semestero ME</span>
        </a>
        <div class="countdown" id="countdown-text">מועבר אוטומטית לעמוד הראשי בעוד <span id="timer">4</span> שניות...</div>
    </div>

    <script>
        let seconds = 4;
        const timerEl = document.getElementById('timer');
        const interval = setInterval(() => {
            seconds--;
            if (timerEl) timerEl.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = './index.html';
            }
        }, 1000);
    </script>
</body>
</html>
